<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pulseline">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Pulseline · Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13;--panel:#151A23;--line:#242D3B;--ink:#E9EEF5;--muted:#8A96A8;--faint:#5A667A;
  --tape:#F0B437;--alert:#FF3B5C;--ok:#4FC98B;
  --ic:#37A8A0;                 /* current interval color, animated */
  --icbg:#37A8A0;               /* same color, luminance-capped for full-screen use */
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Chakra Petch',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;
  height:100dvh;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ splash ============ */
#splash{height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px 18px;gap:14px;overflow-y:auto}
#splash h1{font-family:var(--disp);font-size:22px;letter-spacing:.05em}
#splash h1 em{font-style:normal;color:var(--tape)}
#splash .sub{color:var(--muted);font-size:13px;margin-top:-8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
button.card:active{border-color:var(--tape)}
.card .nm{font-family:var(--disp);font-weight:700;font-size:16px;margin-bottom:6px}
.card .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .meta b{color:var(--ink)}
.card .warn{color:var(--alert)}
.card .okc{color:var(--ok)}
.card .ibar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px}
.note{color:var(--faint);font-size:12.5px;line-height:1.5}
.btnrow{display:flex;gap:10px}
.bigbtn{flex:1;font-family:var(--disp);font-weight:700;font-size:15px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:center;text-decoration:none;color:var(--ink)}
.bigbtn.primary{background:var(--tape);color:#141414;border-color:var(--tape)}
.bigbtn.on{background:var(--tape);color:#141414;border-color:var(--tape)}
#clientRow{display:flex;gap:8px}
#clientRow input{flex:1;font-family:var(--mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);outline:none}

/* ============ workout mode ============ */
#work{display:none;height:100dvh;flex-direction:column;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 34%,
    color-mix(in srgb,var(--ic) 55%,#0B0E13) 78%,var(--ic) 120%);
  transition:--ic .6s;padding-bottom:env(safe-area-inset-bottom)}
#strip{height:31dvh;min-height:170px;position:relative;padding-top:max(8px,env(safe-area-inset-top))}
body.m-min #strip{height:15dvh;min-height:96px;max-height:120px}
body.m-focus #strip{display:none}
body.m-focus #hud{padding-top:max(14px,env(safe-area-inset-top))}
body.m-focus #intName{font-size:clamp(24px,7vw,40px)}
#tl{display:block;width:100%;height:100%}
#hud{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:6px 16px 4px;text-align:center;min-height:0}
#topInfo{display:flex;flex-direction:column;gap:18px;align-items:center;flex:0 0 auto}
#songPair,#intPair{display:flex;flex-direction:column;gap:3px;align-items:center;max-width:96vw}
#plPill{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:rgba(255,255,255,.9);
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);border-radius:20px;
  padding:4px 12px;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plPill b{color:#fff;font-weight:600}
/* flex:1 + min-height:0 means this box's size comes from the layout, not from the text inside.
   (If it ever sizes to its content, fitCount feeds back into itself and creeps.) */
#countWrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;
  width:100%;min-height:0;overflow:hidden}
#songLine{font-size:14.5px;color:var(--ink);max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songLine .art{color:var(--muted)}
#songTime{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:2px}
#intName{font-family:var(--disp);font-weight:700;font-size:clamp(21px,6.5vw,34px);letter-spacing:.04em;
  text-shadow:0 2px 14px rgba(0,0,0,.45);margin-top:2px;
  max-width:96vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Each glyph sits in a fixed-width cell, so the timer never shifts as digits change.
   (Rajdhani has no tabular-figure feature, so we enforce the grid ourselves.) */
#count{font-family:'Rajdhani',var(--disp);font-weight:700;
  font-size:34vw;line-height:.86;white-space:nowrap;letter-spacing:0;
  text-shadow:0 4px 30px rgba(0,0,0,.5)}
#count i{font-style:normal;display:inline-block;text-align:center}
#count i.d{width:.58em}
#count i.c{width:.26em}
#totals{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.66)}
#controls{display:flex;gap:12px;padding:8px 16px 14px;align-items:center}
#exitBtn,#pauseBtn,#modeBtn{border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.3);backdrop-filter:blur(4px)}
#exitBtn,#modeBtn{width:64px;height:58px;font-size:20px}
#pauseBtn{flex:1;height:58px;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.06em}
#pauseBtn.paused{background:var(--tape);color:#141414;border-color:var(--tape)}
#liveTag{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;font-family:var(--mono);font-size:10.5px;
  padding:2px 9px;border-radius:12px;background:rgba(0,0,0,.4)}
#liveTag.live{color:var(--ok)}#liveTag.sim{color:var(--muted)}
#netTag{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;font-family:var(--mono);
  font-size:10.5px;padding:2px 9px;border-radius:12px;background:rgba(0,0,0,.4);color:var(--alert)}
/* ---- landscape on a phone: solid interval color, name + timer only ---- */
@media (orientation:landscape) and (max-height:520px){
  /* always full-size focus: solid interval color, white type, no mode switching */
  #work{background:var(--icbg,var(--ic));transition:background .5s}
  #strip,#songLine,#songTime,#totals,#liveTag,#modeBtn{display:none!important}
  /* the notch lands left or right depending on which way you turned — respect both */
  #hud{justify-content:center;color:#fff;
    padding:2vh calc(72px + env(safe-area-inset-right)) 2vh calc(16px + env(safe-area-inset-left))}
  #topInfo{flex:0 0 auto;gap:0}
  #intPair{gap:5px}
  #plPill{font-size:11px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.18);
    border-color:rgba(255,255,255,.3)}
  #countWrap{flex:1 1 0;min-height:0}      /* same rule in landscape — never content-sized */
  #intName{font-family:var(--disp);font-weight:700;font-size:clamp(18px,5vh,42px);
    letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.28);opacity:.95;color:#fff;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #count{font-family:'Rajdhani',var(--disp);font-weight:700;
    line-height:.88;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.25)}
  #controls{position:fixed;right:calc(8px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);
    flex-direction:column;gap:8px;padding:0;width:auto}
  #exitBtn{width:44px;height:40px;font-size:15px;border-color:rgba(255,255,255,.5);
    background:rgba(0,0,0,.16);color:#fff}
  #pauseBtn{flex:0 0 auto;width:44px;height:74px;font-size:11px;letter-spacing:.06em;
    border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.16);color:#fff;writing-mode:vertical-rl}
  #pauseBtn.paused{background:rgba(255,255,255,.92);color:#141414;border-color:transparent}
  #toast{bottom:14px}
  /* Landscape has width, not height. The card becomes two columns — identity on the
     left, actions on the right — so everything fits without a scroll. */
  #doneOv{padding:8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left))}
  #doneBox{width:min(1000px,97vw);max-height:96dvh;overflow:hidden;padding:16px 22px;text-align:left;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0 26px;align-items:center}
  #doneBox .dHead{grid-column:1;margin:0;align-self:center}
  #doneOv h2{font-size:clamp(17px,3.4vh,22px);line-height:1.15}
  #doneOv p{margin-top:5px;font-size:12px}
  #doneName{font-size:13px}
  /* A border-left spans the element's full height, so it collided with the Done
     button below. Use an inset pseudo-element instead: shorter than the column and
     faded at both ends, so it reads as a separator rather than a hard edge. */
  #doneBox #handoffWrap{grid-column:2;grid-row:1;position:relative;
    border-top:0 !important;border-left:0 !important;
    padding:0 0 0 26px;margin:0}
  #doneBox #handoffWrap::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;
    background:linear-gradient(to bottom,transparent 0,var(--line) 14%,var(--line) 86%,transparent 100%)}
  .dLabel{margin-bottom:7px}
  .dToggle{padding:8px 11px;font-size:12.5px}
  .dToggle .sw{width:38px;height:21px}
  .dToggle .sw::after{width:15px;height:15px}
  .dToggle input:checked + .sw::after{transform:translateX(17px)}
  .dBtns{flex-direction:row;gap:8px;margin-top:8px}
  .dBtns .cbtn{flex:1;padding:10px;font-size:13px}
  #handoffList{margin-top:8px;max-height:22dvh;overflow:auto}
  #handoffList .dv{padding:8px 11px;font-size:12.5px}
  /* Done spans the full width beneath both columns */
  #doneBox .dDone{grid-column:1 / -1;margin-top:16px;padding:10px;font-size:13px}
}
/* overall-workout progress: only in landscape, hugging the very bottom edge */
#progBar{display:none}
@media (orientation:landscape) and (max-height:520px){
  #progBar{display:block;position:fixed;left:0;right:0;bottom:0;height:3dvh;min-height:9px;max-height:22px;
    background:rgba(0,0,0,.14);z-index:40;pointer-events:none}
  #progFill{height:100%;width:0;background:#fff;transition:width .25s linear}
  #hud{padding-bottom:calc(3dvh + 8px)}
  #controls{margin-top:-1.5dvh}
}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0B0E13;border:1px solid var(--line);
  border-radius:10px;padding:10px 16px;font-size:13px;display:none;z-index:99;max-width:92vw;text-align:center}
#confirmOv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;
  background:rgba(6,9,14,.82);backdrop-filter:blur(3px);padding:16px}
#confirmOv.on{display:flex}
#confirmBox{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;width:min(420px,92vw);text-align:center;
  max-height:92dvh;overflow:auto}
#confirmBox h3{font-family:var(--disp);font-size:19px;margin-bottom:6px}
#confirmBox p{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:16px}
.cbtn{display:block;width:100%;font-family:var(--disp);font-weight:700;font-size:15px;
  padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);margin-top:8px}
.cbtn.primary{background:var(--tape);border-color:var(--tape);color:#141414}
.cbtn.danger{background:transparent;border-color:var(--alert);color:var(--alert)}
@media (orientation:landscape) and (max-height:520px){
  #confirmBox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:min(560px,94vw);padding:14px}
  #confirmBox h3{flex:1 1 100%;font-size:16px;margin:0}
  #confirmBox p{flex:1 1 100%;margin:0 0 6px}
  .cbtn{flex:1;width:auto;margin:0;padding:12px}
}
/* Completion dialog — same card language as the confirm sheet. */
#doneOv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,14,.86);backdrop-filter:blur(3px);z-index:50;padding:16px}
#doneBox{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;width:min(430px,94vw);max-height:94dvh;overflow:auto;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
#doneBox .dHead{margin-bottom:15px}
#doneOv h2{font-family:var(--disp);font-size:26px;letter-spacing:.06em;color:var(--tape);line-height:1.1}
#doneOv p{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
#doneName{font-family:var(--disp);font-size:14px;color:var(--ink);letter-spacing:.03em}
#doneLog{font-size:12px;color:var(--faint)}
#doneLog:empty{display:none}
#doneLog.bad{color:var(--alert)}
.dLabel{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);text-align:left;margin-bottom:9px}
/* Portrait only: the divider is a horizontal rule above the actions. Landscape turns
   this into a vertical column rule — and because that override lives earlier in the
   sheet, this rule must not re-apply border-top at equal specificity. */
#handoffWrap{display:none;padding-top:14px;margin-bottom:14px}
@media not all and (orientation:landscape), (min-height:521px){
  #handoffWrap{border-top:1px solid var(--line)}
}
.dBtns{display:flex;flex-direction:column;gap:9px;margin-top:11px}
#doneBox .cbtn{margin:0}
#doneBox .dDone{background:transparent;border-color:var(--line);color:var(--muted)}
#doneBox .dDone:hover{color:var(--ink);border-color:var(--tape)}
/* toggle */
.dToggle{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-size:13.5px;text-align:left}
.dToggle input{position:absolute;opacity:0;width:0;height:0}
.dToggle .sw{flex:0 0 auto;width:42px;height:24px;border-radius:999px;background:#2B3542;
  border:1px solid var(--line);position:relative;transition:background .18s}
.dToggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--muted);transition:transform .18s,background .18s}
.dToggle input:checked + .sw{background:rgba(240,180,55,.28);border-color:var(--tape)}
.dToggle input:checked + .sw::after{transform:translateX(18px);background:var(--tape)}
#handoffList{display:flex;flex-direction:column;gap:7px;margin-top:11px}
#handoffList .dv{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;font-size:13.5px;text-align:left;background:var(--panel2)}
#handoffList .dv:hover{border-color:var(--tape)}
#handoffList .dv b{flex:1;font-weight:600}
#handoffList .dv small{color:var(--faint)}
#handoffList .note{color:var(--faint);font-size:12.5px;padding:2px;text-align:left;line-height:1.5}
</style>
</head>
<body>

<div id="splash">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
    <h1><a href="./" style="color:inherit;text-decoration:none" title="Back to the editor">PULSE<em>LINE</em></a> <span style="font-size:13px;color:var(--faint)">workout mode</span></h1>
    <a href="calendar.html" style="font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--tape);
      text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;white-space:nowrap">Calendar</a>
  </div>
  <div class="sub" id="who">Checking Spotify connection…</div>
  <div id="connectBox" style="display:none">
    <p class="note" style="margin-bottom:10px">Log into Spotify on this device (one time). Uses the same app Client ID as the desktop dashboard; make sure <b id="ruShow"></b> is added as a redirect URI.</p>
    <div id="clientRow"><input id="cid" placeholder="Spotify Client ID" spellcheck="false">
      <button class="bigbtn primary" id="loginBtn" style="flex:0 0 auto">Log in</button></div>
  </div>
  <div id="targetBox" style="display:none">
    <div style="font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:6px">PLAY THROUGH</div>
    <div style="display:flex;gap:8px">
      <button class="bigbtn" id="tgtSdk">This app</button>
      <button class="bigbtn" id="tgtConnect">Spotify app</button>
    </div>
    <p class="note" id="tgtNote" style="margin-top:6px"></p>
  </div>
  <div id="wsList"></div>
  <p class="note" id="hint"></p>
</div>

<div id="work">
  <div id="strip"><canvas id="tl"></canvas><span id="liveTag"></span>
    <span id="netTag" style="display:none">reconnecting…</span></div>
  <div id="hud">
    <div id="topInfo">
      <div id="songPair">
        <div id="songLine"></div>
        <div id="songTime"></div>
      </div>
      <div id="intPair">
        <div id="intName"></div>
        <div id="plPill"></div>
      </div>
    </div>
    <div id="countWrap"><div id="count">0:00</div></div>
    <div id="totals"></div>
  </div>
  <div id="progBar"><div id="progFill"></div></div>
  <div id="controls">
    <button id="exitBtn" title="End workout">✕</button>
    <button id="pauseBtn">PAUSE</button>
    <button id="modeBtn" title="Display mode: full / minimal / focus">▤</button>
  </div>
</div>

<div id="confirmOv">
  <div id="confirmBox">
    <h3>End this workout?</h3>
    <p id="confirmStats"></p>
    <button class="cbtn primary" id="cfEnd">End workout</button>
    <button class="cbtn danger" id="cfDiscard">Discard workout</button>
    <button class="cbtn" id="cfBack">Keep going</button>
  </div>
</div>

<div id="doneOv">
  <div id="doneBox">
    <div class="dHead">
      <h2>WORKOUT COMPLETE</h2>
      <p id="doneStats"></p>
      <p id="doneName"></p>
      <p id="doneLog"></p>
    </div>
    <div id="handoffWrap">
      <div class="dLabel">Keep the music going</div>
      <label class="dToggle" id="shuffleRow" title="Turn Spotify shuffle on for the playlist when handing off">
        <span>Shuffle after handoff</span>
        <input type="checkbox" id="shuffleAfter"><span class="sw"></span>
      </label>
      <div class="dBtns">
        <button class="cbtn primary" id="handoffBtn">Continue in Spotify</button>
        <button class="cbtn" id="handoffOther">Choose another device</button>
      </div>
      <div id="handoffList"></div>
    </div>
    <button class="cbtn dDone" id="doneBtn">Done</button>
  </div>
</div>
<div id="toast"></div>

<script src="config.js?v=4"></script>
<script src="sync-core.js?v=2"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`:`${m}:${String(ss).padStart(2,"0")}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT;function toast(m,ms=3200){const t=$("#toast");t.textContent=m;t.style.display="block";
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",ms)}
const INTENSITY={low:{label:"LOW",color:"#37A8A0"},medium:{label:"MED",color:"#E7B94F"},
                 high:{label:"HIGH",color:"#EA7A3B"},peak:{label:"PEAK",color:"#E93E5C"}};

/* ---------- device auth (same localStorage keys as the dashboard) ---------- */
const LSD={get:(k,d)=>{try{const v=localStorage.getItem("pl_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
           set:(k,v)=>localStorage.setItem("pl_"+k,JSON.stringify(v))};
const CFG_ID=(typeof window.PULSELINE_CLIENT_ID==="string"&&/^[0-9a-f]{32}$/i.test(window.PULSELINE_CLIENT_ID))
  ?window.PULSELINE_CLIENT_ID:null;
const AUTH={get clientId(){return CFG_ID||LSD.get("clientId",null)},set clientId(v){LSD.set("clientId",v)},
  get tok(){return LSD.get("tok",null)},set tok(v){LSD.set("tok",v)},
  redirectUri:location.origin+location.pathname};
/* ---------- client diagnostics -> data/clientlog-<ns>.jsonl (docs/DEVELOPING.md) ----------
   Batched, fire-and-forget, never blocks the workout and never includes tokens. Entries
   wait in memory until the account namespace is known. */
const CLOG={q:[],t:null};
function clog(type,data){
  try{
    CLOG.q.push({t:Date.now(),page:"workout",type,...(data||{})});
    if(CLOG.q.length>200)CLOG.q.splice(0,CLOG.q.length-200);
    clearTimeout(CLOG.t);CLOG.t=setTimeout(clogFlush,1500);
  }catch(e){}
}
function clogFlush(){
  try{
    const ns=LSD.get("ns",null);if(!ns||!CLOG.q.length)return;
    const entries=CLOG.q.splice(0,50);
    fetch("/api/log/"+encodeURIComponent(ns),{method:"POST",keepalive:true,
      headers:{"Content-Type":"application/json"},body:JSON.stringify({entries})}).catch(()=>{});
    if(CLOG.q.length)CLOG.t=setTimeout(clogFlush,1500);
  }catch(e){}
}
addEventListener("pagehide",clogFlush);

/* ---------- containment for the run loop ----------
   Under "use strict", moving or deleting a block orphans an identifier it defined and
   the resulting ReferenceError aborts the rest of the function (docs/DEVELOPING.md,
   Hotspots 2). In tick() that used to stop the run-through dead: frozen countdown,
   button still reading PAUSE, nothing shown anywhere. The loop now survives it.
   Reported ONCE per label per run, because tick() runs ~60 times a second. */
let loopFailed=null;
function guardRun(label,fn){
  try{fn();return true}
  catch(e){
    const msg=(e&&e.message)||String(e);
    if(loopFailed!==label){
      loopFailed=label;
      clog("loopFail",{label,msg});
      toast(label+" stopped working ("+msg+") - the workout is still running",8000);
    }
    return false;
  }
}
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function tokenRequest(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  if(!r.ok){clog("auth",{grant:body.grant_type,status:r.status});
    const err=new Error("Spotify login failed ("+r.status+")");
    err.fatal=(r.status===400||r.status===401);throw err}   // only 400/401 mean the session is dead
  const j=await r.json();
  AUTH.tok={access:j.access_token,refresh:j.refresh_token||(AUTH.tok&&AUTH.tok.refresh),
    scope:j.scope||(AUTH.tok&&AUTH.tok.scope)||"",exp:Date.now()+(j.expires_in-60)*1000};
}
async function login(){
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  LSD.set("verifier",verifier);
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({
    client_id:AUTH.clientId,response_type:"code",redirect_uri:AUTH.redirectUri,
    scope:"playlist-read-private playlist-read-collaborative playlist-modify-public playlist-modify-private user-read-playback-state user-modify-playback-state streaming user-read-email user-read-private",
    code_challenge_method:"S256",code_challenge:challenge});
}
/* Single-flight refresh, ported from index.html. Spotify rotates the refresh token on
   every refresh, so two overlapping refreshes (SDK getOAuthToken, a poll, reviveSession)
   would spend the same token twice and the loser gets a 400. Other pages on this origin
   share the token too: if a 400 arrives but another tab has already stored a newer
   refresh token, that is a lost race, not a dead session. */
let refreshPromise=null;
const SKEW_MS=120000;
function refreshToken(){
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async()=>{
    const t=AUTH.tok;
    if(!t||!t.refresh){const e=new Error("Not connected");e.fatal=true;throw e}
    let last=null;
    for(let a=0;a<4;a++){
      try{await tokenRequest({grant_type:"refresh_token",refresh_token:t.refresh,client_id:AUTH.clientId});
        return AUTH.tok.access}
      catch(e){
        last=e;
        if(e.fatal){const cur=AUTH.tok;if(cur&&cur.refresh&&cur.refresh!==t.refresh)return cur.access;throw e}
        await new Promise(r=>setTimeout(r,[400,1200,3000][a]||3000));
      }
    }
    throw last||new Error("token refresh failed");
  })().finally(()=>{refreshPromise=null});
  return refreshPromise;
}
async function ensureToken(force){
  const t=AUTH.tok;
  if(!t){const e=new Error("Not connected");e.fatal=true;throw e}
  if(!force&&Date.now()<t.exp-SKEW_MS)return t.access;
  return refreshToken();
}
/* Network state, surfaced instead of silently failing. */
let netDown=false;
function netOK(){if(netDown){netDown=false;setNetTag(false);toast("Reconnected to Spotify",2500)}}
function netBad(){if(!netDown){netDown=true;setNetTag(true)}}
function setNetTag(down){const el=$("#netTag");if(el)el.style.display=down?"":"none"}
async function api(path,opts={},_depth=0){
  let access;
  try{access=await ensureToken()}
  catch(e){if(e.fatal)throw e;netBad();throw e}
  let r;
  try{
    r=await fetch("https://api.spotify.com/v1"+path,{method:opts.method||"GET",
      headers:{Authorization:"Bearer "+access,...(opts.body?{"Content-Type":"application/json"}:{})},
      body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){
    /* fetch itself threw: offline, radio asleep, DNS. Transient by definition. */
    netBad();
    if(_depth<3){await new Promise(x=>setTimeout(x,[500,1500,4000][_depth]));return api(path,opts,_depth+1)}
    throw new Error("network unreachable");
  }
  if(r.status===401&&_depth<2){          // token rejected: force one refresh, then retry
    try{await ensureToken(true)}catch(e){if(e.fatal)throw e}
    return api(path,opts,_depth+1);
  }
  if((r.status===429||r.status>=500)&&_depth<3){
    const wait=r.status===429?(+r.headers.get("Retry-After")||2)*1000:[600,1800,4000][_depth];
    await new Promise(x=>setTimeout(x,wait));
    return api(path,opts,_depth+1);
  }
  if(!r.ok){
    let msg="";try{const j=await r.json();msg=(j&&j.error&&j.error.message)||""}catch(e){}
    clog("api",{method:opts.method||"GET",path:path.split("?")[0],status:r.status,msg});
    throw new Error("Spotify "+r.status);
  }
  netOK();
  /* An empty body is a SUCCESS, not a parse error. Spotify's player commands are
     documented as 204 but can answer 200 (or 202) with no content, and r.json() on an
     empty body throws - on WebKit with the message "The string did not match the
     expected pattern.", which is what an iPhone reported for PUT /me/player/shuffle
     and /repeat while shuffle stayed on. The failure looked like "Pulseline cannot turn
     shuffle off" and was really this. debug/sdk-probe.html always read r.text(). */
  if(r.status===204)return null;
  /* A 2xx IS success; the body is informational. Spotify's player commands answer with
     an empty body, and sometimes with a short non-JSON token - an iPhone saw
     `JSON Parse error: Unexpected identifier "RupOGcf..."` from PUT /me/player/shuffle.
     Throwing there turned an ACCEPTED command into a reported failure. Record what came
     back so it stays diagnosable, and return null. */
  const text=await r.text();
  if(!text)return null;
  try{return JSON.parse(text)}
  catch(e){
    /* Via window: only workout.html defines clog, and reaching it through the global
       keeps this one api() body identical across all three copies (CODING_STANDARDS,
       ADR-0001) instead of forking it for one line. */
    if(window.clog)window.clog("apiBody",{method:opts.method||"GET",
      path:path.split("?")[0],status:r.status,head:text.slice(0,120)});
    return null;
  }
}

/* ---------- workout state ---------- */
let me=null,workspaces={},W=null;   // W = active run {ws,key,spans,secs,total,plTotal,live}
const P={t:0,playing:false,last:0,prevSec:-1,slew:0,started:false};
/* Deferred deliberately: dereferencing PLSync at module-evaluation time would throw a
   ReferenceError before the script finished running, so the boot gate below could never
   report the missing dependency and the page would just be blank. Shared with the
   editor (docs/adr/0003). */
const spansOf=trs=>PLSync.spansOf(trs);
const secsOf=ss=>{let t=0;return ss.map(s=>{const x={start:t,end:t+s.lenSec,s};t=x.end;return x})};
const at=(arr,t)=>arr.find(x=>t>=x.start&&t<x.end);

/* ---------- splash ---------- */
function clashCount(spans,secs){let n=0;
  for(let i=0;i<spans.length-1;i++){const h=at(secs,spans[i].end);if(h&&h.s.intensity==="peak")n++}return n}
function renderSplash(){
  const list=$("#wsList");
  const keys=Object.keys(workspaces).filter(k=>{
    const w=workspaces[k];return w&&Array.isArray(w.tracks)&&w.tracks.length&&Array.isArray(w.sections)&&w.sections.length});
  if(!keys.length){
    list.innerHTML='<div class="card"><div class="nm">No workouts yet</div><div class="note">Build a playlist + interval program in the desktop dashboard first — every playlist with an interval list shows up here automatically.</div></div>';
    return;
  }
  keys.sort((a,b)=>(workspaces[b].updated||0)-(workspaces[a].updated||0));
  const PAL=["#F0B437","#37A8A0","#E8743B","#E93E5C","#7C6FE0","#4FC98B","#E7B94F","#4EA8DE"];
  const defC=k=>PAL[[...String(k)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
  list.innerHTML=keys.map(k=>{
    const w=workspaces[k],spans=spansOf(w.tracks),secs=secsOf(w.sections);
    const col=w.color||defC(k);
    const wk=secs.length?secs[secs.length-1].end:0, pl=spans.length?spans[spans.length-1].end:0;
    const cl=clashCount(spans,secs);
    const bar=secs.map(x=>`<span style="flex:${x.s.lenSec};background:${x.s.color}"></span>`).join("");
    return `<button class="card" data-k="${esc(k)}" style="width:100%;margin-bottom:10px;border-left:5px solid ${col}">
      <div class="nm">${esc(w.name||k)}${k==="demo"?" (demo)":""}</div>
      <div class="meta"><span>workout <b>${fmt(wk)}</b></span><span>music <b>${fmt(pl)}</b></span>
        <span>${w.sections.length} intervals</span>
        <span class="${cl?"warn":"okc"}">${cl?cl+" peak clash"+(cl>1?"es":""):"✓ clean"}</span>
        ${w.dirty?'<span class="warn">unsaved edits → simulated only</span>':""}</div>
      <div class="ibar">${bar}</div>
    </button>`}).join("");
  $("#hint").textContent="Tip: start your watch workout + open Spotify first, then pick a workout here.";
}
$("#wsList").addEventListener("click",e=>{
  const c=e.target.closest(".card[data-k]");if(c)startWorkout(c.dataset.k);
});

/* ---------- Spotify Web Playback SDK (browser as the player) ---------- */
let sdk=null,sdkId=null,sdkReady=null;
const hasStreamScope=()=>((LSD.get("tok",{})||{}).scope||"").includes("streaming");
let target=LSD.get("target","sdk");     // "sdk" = play in this app, "connect" = external device
function setTarget(t){
  target=t;LSD.set("target",t);
  $("#tgtSdk").className="bigbtn"+(t==="sdk"?" on":"");
  $("#tgtConnect").className="bigbtn"+(t==="connect"?" on":"");
  /* A login made without the "streaming" permission (e.g. from an older editor) can't
     play in-app. Say so and offer the fix. Never silently switch to "Spotify app"
     mode: that plays on some other device while the badge reads LIVE. */
  if(t==="sdk"&&!hasStreamScope()){
    $("#tgtNote").innerHTML='<b style="color:var(--alert)">In-app playback needs you to reconnect Spotify</b>'
      +' (this login is missing the "streaming" permission). '
      +'<button class="bigbtn" id="reauthBtn" style="margin-top:8px">Reconnect Spotify</button>';
    $("#reauthBtn").onclick=()=>login();
    return;
  }
  $("#tgtNote").textContent=t==="sdk"
    ?"Audio plays from this app — keep the screen on (it stays awake automatically). Nothing else to open."
    :"Audio plays on whatever device Spotify is active on. Open the Spotify app first.";
  if(t==="sdk")initSdk();
}
$("#tgtSdk").onclick=()=>setTarget("sdk");
$("#tgtConnect").onclick=()=>setTarget("connect");
/* In-app audio has failed: never leave the badge saying live over silence. */
let sdkErrTimes=[];
function sdkFail(msg){
  clog("sdkFail",{msg,live:!!(W&&W.live),target});
  if(!W||!W.live||target!=="sdk"){toast(msg,6000);return}
  W.live=false;$("#liveTag").textContent="SIMULATED";$("#liveTag").className="sim";
  if(sdk)sdk.pause().catch(()=>{});            // stop it skipping through the playlist
  toast(msg+" — running simulated. Switch to 'Spotify app' or reconnect.",7000);
}
function initSdk(){
  if(sdkReady||!window.Spotify||!hasStreamScope())return sdkReady;
  sdkReady=new Promise(resolve=>{
    sdk=new Spotify.Player({name:"Pulseline",getOAuthToken:cb=>ensureToken().then(cb),volume:1});
    sdk.addListener("ready",({device_id})=>{sdkId=device_id;resolve(device_id)});
    ["ready","not_ready","initialization_error","authentication_error","account_error",
     "playback_error","autoplay_failed"].forEach(ev=>sdk.addListener(ev,e=>clog("sdk",{ev,msg:(e&&e.message)||""})));
    sdk.addListener("not_ready",()=>{sdkId=null;netBad()});
    sdk.addListener("ready",()=>{netOK()});
    sdk.addListener("initialization_error",({message})=>{resolve(null);sdkFail("In-app player couldn't start ("+message+")")});
    sdk.addListener("authentication_error",({message})=>{resolve(null);sdkFail("In-app player rejected the login ("+message+") — reconnect Spotify")});
    sdk.addListener("account_error",()=>{resolve(null);sdkFail("In-app playback needs Spotify Premium")});
    /* The play command returns 204 even when the player can't produce audio; these
       events are the only report of it. One playback_error can be a single unplayable
       track (the SDK skips it). Several in quick succession means no audio at all:
       a bad login skips through the whole playlist this way. */
    sdk.addListener("playback_error",({message})=>{
      const now=Date.now();
      sdkErrTimes=sdkErrTimes.filter(x=>now-x<15000);sdkErrTimes.push(now);
      if(sdkErrTimes.length>=2)sdkFail("Spotify can't play audio in this app ("+message+")");
      else toast("Spotify couldn't play a track ("+message+")",4000);
    });
    sdk.addListener("autoplay_failed",()=>{
      toast("iOS blocked the audio from starting — tap PAUSE, then RESUME",6000);
    });
    /* real-time sync: fires on every play/pause/seek/track change — no polling */
    sdk.addListener("player_state_changed",st=>{
      if(!st||!W||!W.live||target!=="sdk")return;
      if(!P.started)return;                       // still armed at 0:00, waiting for START
      if(st.paused&&P.playing&&!st.loading){setPaused(true);return}
      if(!st.paused&&!P.playing){setPaused(false);return}   // resumed from headphones/lock screen
      /* No rttSec: the SDK pushes this to us, so there is no round trip to compensate. */
      applySync(PLSync.syncCorrection(W.spans,{
        uri:st.track_window&&st.track_window.current_track&&st.track_window.current_track.uri,
        positionSec:(st.position||0)/1000},P.t));
    });
    sdk.connect();
  });
  return sdkReady;
}
window.onSpotifyWebPlaybackSDKReady=()=>{if(target==="sdk"&&hasStreamScope())initSdk()};

/* ---------- audio cues ---------- */
let AC=null,master=null;
/* iOS suspends (or "interrupts") the AudioContext whenever the app is backgrounded,
   the screen locks, or another app takes the audio session — which includes pausing.
   Once suspended, every scheduled beep is silently dropped. So the context is revived
   before each cue and whenever the page becomes visible, not just once at startup. */
function audioAlive(){
  if(!AC)return false;
  if(AC.state==="running")return true;
  AC.resume().catch(()=>{});
  return AC.state==="running";
}
function ensureAudio(){
  if(AC&&AC.state==="closed")AC=null,master=null;    // can happen after a long suspend
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state!=="running")AC.resume().catch(()=>{});
  if(!master){ // compressor lets us run hot without clipping — the dings must beat the music
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=8;
    comp.attack.value=.002;comp.release.value=.15;
    master=AC.createGain();master.gain.value=1;
    master.connect(comp);comp.connect(AC.destination);
  }
}
function beep(f,t0,dur=.22,vol=1){
  /* square wave (far more piercing than sine) + an octave partial for presence */
  [[1,vol],[2,vol*.45]].forEach(([mult,g])=>{
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type="square";o.frequency.value=f*mult;
    gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(g,t0+.012);
    gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(gn).connect(master);o.start(t0);o.stop(t0+dur+.06);
  });
}
function cueSection(intensity){
  ensureAudio();if(!audioAlive())return;      // resume attempt is async; skip a dead cue
  const n=AC.currentTime;
  if(intensity==="peak"){beep(740,n);beep(880,n+.2);beep(1175,n+.4,.4)}   // rising: go time
  else{beep(880,n);beep(660,n+.24,.3)}}
function cueDone(){
  ensureAudio();if(!audioAlive())return;
  const n=AC.currentTime;beep(880,n,.25);beep(660,n+.28,.25);beep(440,n+.58,.6)}

/* ---------- display modes: full → minimal → focus ---------- */
const MODES=["full","min","focus"],MODE_ICON={full:"▤",min:"▬",focus:"◻"};
let dispMode=LSD.get("dispMode","full");
if(!MODES.includes(dispMode))dispMode="full";
function applyMode(){
  document.body.classList.remove("m-full","m-min","m-focus");
  document.body.classList.add("m-"+dispMode);
  $("#modeBtn").textContent=MODE_ICON[dispMode];
  LSD.set("dispMode",dispMode);
  requestAnimationFrame(()=>{
    if(W&&dispMode!=="focus"){sizeCanvas();draw()}
    fitCount(true);                       // the timer's box just changed size
  });
}
$("#modeBtn").onclick=()=>{
  dispMode=MODES[(MODES.indexOf(dispMode)+1)%MODES.length];
  applyMode();
};

/* ---------- wake lock ---------- */
let wake=null;
async function grabWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
/* Coming back to the app after minutes or hours: the wake lock is gone, the audio
   context is suspended, the access token may have expired and the SDK player may have
   dropped its socket. Recover all of it instead of waiting for the next failure. */
let reviving=false;
async function reviveSession(){
  if(reviving)return;reviving=true;
  try{
    if(W)grabWake();
    ensureAudio();
    try{await ensureToken()}catch(e){ if(e.fatal){toast("Spotify session ended — reopen to log in",6000);} }
    if(W&&W.live&&target==="sdk"&&sdk){
      /* the SDK socket dies while backgrounded; reconnect if it is no longer ready */
      if(!sdkId){try{await sdk.connect()}catch(e){}}
    }
    if(W&&W.live&&P.started&&P.playing){
      try{const st=await api("/me/player");
        if(st&&!st.is_playing)setPaused(true);     // it stopped while we were away
      }catch(e){}
    }
  }finally{reviving=false}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible")reviveSession();
});
window.addEventListener("focus",()=>reviveSession());
window.addEventListener("online",()=>{netOK();reviveSession()});
window.addEventListener("offline",()=>netBad());

/* ---------- run lifecycle ---------- */
async function startWorkout(key){
  const ws=workspaces[key];
  const spans=spansOf(ws.tracks),secs=secsOf(ws.sections);
  W={ws,key,spans,secs,total:secs[secs.length-1].end,
     plTotal:spans.length?spans[spans.length-1].end:0,
     live:key!=="demo"&&!ws.dirty,
     /* One latch per reason. These three warnings used to share W.orderWarned, which
        sprang into existence from whichever fired first, so the shuffle warning
        silenced the order-drift warning for the rest of the run. */
     warned:{shuffle:false,noMatch:false,order:false}};
  P.t=0;P.prevSec=-1;P.started=false;
  ensureAudio();
  /* iOS requires the audio element to be unlocked inside the tap that started us */
  if(W.live&&target==="sdk"&&sdk){try{await sdk.activateElement()}catch(e){}}
  $("#splash").style.display="none";$("#work").style.display="flex";
  $("#liveTag").textContent=W.live?(target==="sdk"?"● IN-APP":"● LIVE"):"SIMULATED";
  $("#liveTag").className=W.live?"live":"sim";
  grabWake();
  /* Nothing plays yet. Silence until START — the music and the clock begin together.
     We only warm up the SDK device here so START has no wait. */
  if(W.live&&target==="sdk")initSdk();
  loopFailed=null;                    // a new run may report a display failure again
  P.playing=false;P.started=false;
  $("#pauseBtn").textContent="START";
  $("#pauseBtn").classList.add("paused");
  applyMode();
  sizeCanvas();draw();updateHud();fitCount(true);
}
async function logWorkout(completed){
  if(!window.HIST_URL||!W){
    if(completed){const el=$("#doneLog");el.textContent="Not saved — no profile connection";el.className="bad"}
    else toast("Workout not logged — no profile connection");
    return;
  }
  /* snapshot EVERYTHING synchronously: W is nulled the moment we return to the splash,
     so nothing after an await may touch it */
  const entry={id:Math.random().toString(36).slice(2,10),ts:Date.now(),
    key:W.key,name:W.ws.name||W.key,color:W.ws.color||null,
    planned:Math.round(W.total),elapsed:Math.round(Math.min(P.t,W.total)),completed:!!completed};
  /* append-only endpoint: the server merges it into history-<user>.json, so no client
     can overwrite the log by flushing a stale copy of its own state */
  /* When the completion card is up it already reports the workout, so a toast would
     only cover it. Report inline there and toast only when there is no card — which
     is the early-exit path, where the toast is the sole confirmation. A failure is
     always surfaced, just in whichever place is actually visible. */
  const inCard=!!completed;
  const say=(msg,bad)=>{
    if(inCard){const el=$("#doneLog");el.textContent=msg;el.className=bad?"bad":""}
    else toast(msg,bad?5000:3200);
  };
  try{
    const r=await fetch(window.HIST_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:"add",entry})});
    if(!r.ok)throw new Error("save rejected ("+r.status+")");
    /* silence on success: the card appearing at all is the confirmation */
  }catch(e){say("Couldn't save to your history: "+e.message,true)}
}
function endWorkout(showDone,doLog){
  /* showDone === finished naturally: leave the playlist rolling (cooldown music).
     Only an explicit ✕ exit stops the audio. */
  if(W&&W.live&&!showDone){
    if(target==="sdk"&&sdk)sdk.pause().catch(()=>{});
    else api("/me/player/pause",{method:"PUT"}).catch(()=>{});
  }
  P.playing=false;clearInterval(pollH);pollH=null;stopPausePoll();
  if(doLog===undefined?showDone:doLog)logWorkout(showDone);
  if(wake){wake.release().catch(()=>{});wake=null}
  if(showDone){
    try{cueDone()}catch(e){}

    $("#doneLog").textContent="";$("#doneLog").className="";
    $("#doneStats").textContent=`${fmt(W.total)} · ${W.ws.sections.length} intervals`;
    $("#doneName").textContent=W.ws.name||"";
    /* Offer the handoff whenever music is genuinely playing. In-app playback dies
       when this page closes, so it is essential there; in Spotify-app mode it is
       still useful for moving the music to another device (or another room). It is
       only hidden when there is no live audio to hand off — and then we say so,
       rather than silently showing a bare dialog. */
    const canHand=!!W.live;
    handoffCtx=canHand?{}:null;
    $("#handoffWrap").style.display=canHand?"block":"none";
    $("#handoffBtn").style.display="";$("#handoffOther").style.display="";

   whatever this network and device are really like. */

      /* computed at the moment of sending, so the reading's own age is included */

      const sentAt=performance.now(),wanted=body.position_ms;

   cleared before the first note. The endpoints need an active device, so the target
   is activated (without playing) first. Best-effort: a device that rejects them must
   not stop the workout, and the order check during playback will catch the fallout. */
async function forceLinearPlayback(deviceId){
  const q=deviceId?"&device_id="+encodeURIComponent(deviceId):"";
  try{
    if(deviceId)await api("/me/player",{method:"PUT",body:{device_ids:[deviceId],play:false}});
  }catch(e){}
  let ok=true;
  try{await api("/me/player/shuffle?state=false"+q,{method:"PUT"})}
  catch(e){ok=false;clog("linearFail",{step:"shuffle",msg:e.message,name:e.name})}
  try{await api("/me/player/repeat?state=off"+q,{method:"PUT"})}
  catch(e){ok=false;clog("linearFail",{step:"repeat",msg:e.message,name:e.name})}
  /* Settle, verify, and re-apply once - and this is LOAD-BEARING, not a diagnostic.
     Spotify accepts shuffle?state=false with a 200 and applies it asynchronously, so a
     device that was just transferred to can still report shuffle_state:true right
     afterwards. Issue play before it propagates and the queue is already shuffled; by
     quirk 4, turning shuffle off after play does NOT reorder the queue, so this is the
     only place a retry can help. Evidence: a run without this read started shuffled,
     and the next run with it did not (data/clientlog, 2026-11-11).
     Do not remove it to save the round trip, and do not loop it: START is a user
     gesture and must stay responsive. */
  try{
    const st=await api("/me/player");
    if(st){
      const sh={};for(const k of Object.keys(st))if(/shuffle/i.test(k))sh[k]=st[k];
      clog("shuffleState",{when:"before-play",observed:sh,repeat:st.repeat_state});
      if(st.shuffle_state){
        try{await api("/me/player/shuffle?state=false"+q,{method:"PUT"});
          clog("shuffleRetry",{});}
        catch(e){ok=false;clog("linearFail",{step:"shuffle-retry",msg:e.message,name:e.name})}

  }catch(e){}

}

function setPaused(pause){

    if(!pause)guardRun("The interval ding",()=>ensureAudio());  // pausing can suspend the audio session
    $("#pauseBtn").textContent=pause?(P.started?"RESUME":"START"):"PAUSE";
    $("#pauseBtn").classList.toggle("paused",pause);

/* ---------- clock ---------- */
/* Apply a live sync decision from sync-core.js, and surface its diagnosis once per
   reason per run. Both callers - the SDK's player_state_changed and the Spotify-app
   poll - go through here, so the in-app path now reports order drift and stray tracks
   too. It previously reported neither: on no match it returned silently, which is why
   a shuffled in-app workout gave no indication at all. */
/* Record the first live-sync verdict of each kind, once per run. This is the only
   direct measurement of whether the audio is actually in timeline order.
   `shuffle_state` is a flag ABOUT the player, not evidence about the queue: a run was
   reported where the order warning fired while the playlist played correctly, and
   another where shuffle read as on after play with no audible problem. So stop
   inferring order from the flag and log what live sync actually observes. */
function logSyncOnce(kind,extra){
  if(!W)return;
  W.diagLogged=W.diagLogged||{};
  if(W.diagLogged[kind])return;
  W.diagLogged[kind]=true;
  /* WHERE in the run this happened decides whether it means anything. endWorkout
     deliberately leaves the music rolling for the cooldown, so once the clock passes
     W.total Spotify carries on past the playlist and sync correctly sees a track that
     is not in the workout. That is expected behaviour, not a shuffle problem - without
     `at`/`total` a noMatch logged at the end looks identical to one at the start. */
  clog("syncDiag",{diagnosis:kind,at:Math.round(P.t),total:Math.round(W.total),
    done:P.t>=W.total,...(extra||{})});
}
function applySync(dec){
  if(dec.diagnosis==="noUri")return;          // player blinked between tracks
  if(dec.diagnosis==="noMatch"){
    logSyncOnce("noMatch");
    if(W&&!W.warned.noMatch){W.warned.noMatch=true;
      toast("Spotify is playing a track that isn't in this workout — shuffle may be on",6000)}
    return;
  }
  if(dec.diagnosis==="orderDrift"){
    logSyncOnce("orderDrift",{action:dec.action});
    if(W&&!W.warned.order){W.warned.order=true;
      toast("Playback order doesn't match the timeline — check that shuffle is off in Spotify",6000)}
  }else logSyncOnce("inOrder");

  else if(dec.action==="slew")P.slew=dec.by;

function tick(ts){
  if(!W||!P.playing)return;

     The cue and the redraw are additionally wrapped in guardRun so the user is TOLD
     rather than left watching a frozen countdown. See Hotspots 2. */
  try{
    const dt=Math.min(.25,(ts-P.last)/1000);P.last=ts;
    P.t+=dt;
    /* absorb sync corrections gently (max ±12% clock rate) so the countdown never flickers */
    const step=PLSync.absorbStep(P.slew,dt);P.t+=step;P.slew-=step;
    const secIdx=W.secs.findIndex(x=>P.t>=x.start&&P.t<x.end);
    if(secIdx!==P.prevSec){
      if(secIdx>=0&&P.prevSec>=0)
        guardRun("The interval ding",()=>cueSection(W.secs[secIdx].s.intensity));
      P.prevSec=secIdx;
    }
    if(P.t>=W.total){
      P.t=W.total;
      guardRun("The timeline",()=>{draw();updateHud()});
      endWorkout(true);                 // must run even if the final redraw threw
      return;
    }
    guardRun("The timeline",()=>{redrawIfResized();updateHud()});
  }finally{

  const gap=age<2*60*1000?5000:20000;                  // attentive for 2 min, then relaxed

/* ---------- perceptual brightness cap for the full-screen backdrop ----------
   Full-bleed landscape paints the interval color across the whole screen, where a bright
   yellow is genuinely painful and a deep purple is fine. We measure relative luminance
   (sRGB → linear, weighted .2126R/.7152G/.0722B — which is why yellow reads far brighter
   than purple at equal saturation) and, only if it exceeds a ceiling, scale the linear
   channels toward it. Scaling in linear space preserves hue and saturation ratios, so the
   color stays clearly recognisable — just no longer blinding. */
const srgb2lin=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const lin2srgb=c=>{const v=c<=.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-.055;
  return Math.max(0,Math.min(255,Math.round(v*255)))};
const LUM_CEIL=.28;          // target max relative luminance for the full-screen backdrop
function toneDown(hex,ceil=LUM_CEIL){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return hex;
  const n=parseInt(m[1],16),R=srgb2lin((n>>16)&255),G=srgb2lin((n>>8)&255),B=srgb2lin(n&255);
  const L=.2126*R+.7152*G+.0722*B;
  if(L<=ceil)return hex;                       // already comfortable — leave it alone
  const k=Math.pow(ceil/L,.78);                // gentle: not a hard clamp to the ceiling
  return "#"+[R*k,G*k,B*k].map(c=>lin2srgb(c).toString(16).padStart(2,"0")).join("");
}

/* ---------- timer: fixed-width cells + fit-to-box sizing ---------- */
const CELL_D=.58,CELL_C=.26;              // em widths of a digit / colon cell (must match CSS)
let lastTxt="",lastFit="";
function setCount(txt){
  if(txt===lastTxt)return;
  lastTxt=txt;
  $("#count").innerHTML=[...txt].map(ch=>ch===":"
    ?'<i class="c">:</i>'
    :`<i class="d">${ch}</i>`).join("");

const countRatio=txt=>[...txt].reduce((a,c)=>a+(c===":"?CELL_C:CELL_D),0);
function fitCount(force){
  const el=$("#count"),box=$("#countWrap"),txt=lastTxt||"0:00";
  const availW=(box.clientWidth||window.innerWidth)*.94;
  const availH=(box.clientHeight||window.innerHeight*.4)*.96;
  /* Quantise the box dims: tiny sub-pixel wobble must not re-trigger a fit, and the
     signature keys on cell COUNT (not the digits) so ticking never resizes. */
  const sig=txt.length+"|"+(availW/8|0)+"|"+(availH/8|0);
  if(!force&&sig===lastFit)return;
  lastFit=sig;
  const byW=availW/countRatio(txt);
  const byH=availH/.78;                    // cap height ≈ .78em
  el.style.fontSize=Math.round(Math.max(48,Math.min(byW,byH)))+"px";

  if(sp){$("#songLine").innerHTML=`♪ <b>${esc(sp.tr.name)}</b> <span class="art">— ${esc(sp.tr.artists)}</span>`;
    $("#songTime").textContent=`${fmt(P.t-sp.start)} / ${fmt(sp.tr.durMs/1000)}`}
  else{$("#songLine").innerHTML='<span class="art">— music ended —</span>';$("#songTime").textContent=""}
  if(sx){
    document.documentElement.style.setProperty("--ic",sx.s.color);
    document.documentElement.style.setProperty("--icbg",toneDown(sx.s.color));
    $("#intName").textContent=sx.s.name;
    const idx=W.secs.indexOf(sx)+1;
    $("#plPill").innerHTML=`${esc(W.ws.name||"")} · <b>${idx}/${W.secs.length}</b>`;
    setCount(fmt(sx.end-P.t));
  }
  $("#totals").textContent=`T+ ${fmt(P.t)}  ·  ${fmt(W.total-P.t)} to go`;
  const pct=W.total>0?Math.max(0,Math.min(1,P.t/W.total))*100:0;
  $("#progFill").style.width=pct.toFixed(2)+"%";
}

/* ---------- sliding timeline strip (2-min window, playhead centred) ---------- */
const cvs=$("#tl"),ctx=cvs.getContext("2d");
let CW=360,CH=200;
function sizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  CW=cvs.clientWidth;CH=cvs.clientHeight;
  cvs.width=Math.round(CW*dpr);cvs.height=Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function redrawIfResized(){ // resync if the element box drifted, then draw.
                            // NOT error containment - see guardRun for that.
  if(cvs.clientHeight!==CH||cvs.clientWidth!==CW)sizeCanvas();
  draw();
}
function onViewportChange(){
  if(!W)return;
  if(!document.body.classList.contains("m-focus")&&$("#strip").offsetParent!==null){sizeCanvas();draw()}
  updateHud();fitCount(true);
}
/* Wait for the viewport to stop moving, then lay out exactly once.
   iOS reports several intermediate sizes mid-rotation; fitting on each one is what
   made the transition look jittery. */
/* One settle pass per viewport change: watch until the window stops moving, then lay out once.
   All sources (resize / orientationchange / visualViewport / media query) funnel through
   the same debounced entry point, so a rotation can only ever trigger a single pass. */
let settleRaf=null,settleTimer=null;
function settleLayout(){
  cancelAnimationFrame(settleRaf);
  let lastW=-1,lastH=-1,stable=0,frames=0;
  const step=()=>{
    const w=innerWidth,h=innerHeight;        // window dims: independent of our own layout
    if(w===lastW&&h===lastH)stable++;else stable=0;
    lastW=w;lastH=h;frames++;
    if(stable>=2||frames>90){onViewportChange();return}
    settleRaf=requestAnimationFrame(step);
  };
  settleRaf=requestAnimationFrame(step);
}
function scheduleSettle(){clearTimeout(settleTimer);settleTimer=setTimeout(settleLayout,50)}
window.addEventListener("resize",scheduleSettle);
window.addEventListener("orientationchange",scheduleSettle);
if(window.visualViewport)window.visualViewport.addEventListener("resize",scheduleSettle);
if(window.matchMedia)matchMedia("(orientation:landscape)").addEventListener?.("change",scheduleSettle);
function draw(){
  const WIN=120,half=WIN/2;
  const pps=CW/WIN,X=t=>(t-(P.t-half))*pps;
  ctx.clearRect(0,0,CW,CH);
  /* Minimal mode compresses the BARS, never the type: fonts stay at full readable size
     and labels are vertically centred in whatever lane height is available. */
  const tiny=CH<130;
  const pad=tiny?4:8,gap=tiny?4:6,ruleH=tiny?14:16;
  const lanes=CH-pad*2-ruleH-gap*2;
  const songH=lanes*.5,secH=lanes*.5;
  const songY=pad,ruleY=songY+songH+gap,secY=ruleY+ruleH+gap;
  ctx.textBaseline="middle";
  /* lanes */
  ctx.fillStyle="rgba(21,26,35,.85)";
  ctx.fillRect(0,songY,CW,songH);ctx.fillRect(0,secY,CW,secH);
  const clip=(x,w)=>({x:Math.max(0,x),w:Math.min(CW,x+w)-Math.max(0,x)});
  W.spans.forEach((sp,i)=>{
    if(sp.end<P.t-half||sp.start>P.t+half)return;
    const c=clip(X(sp.start)+1,(sp.end-sp.start)*pps-2);if(c.w<=0)return;
    ctx.fillStyle=i%2?"#2A3444":"#39465C";
    ctx.fillRect(c.x,songY+(tiny?1:4),c.w,songH-(tiny?2:8));
    if(c.w>50){ctx.save();ctx.beginPath();ctx.rect(c.x+6,songY,c.w-12,songH);ctx.clip();
      ctx.fillStyle="#E9EEF5";ctx.font="600 12px system-ui";
      if(tiny){ // one line, vertically centred in the shorter lane
        ctx.fillText(sp.tr.name,c.x+8,songY+songH/2);
      }else{
        ctx.fillText(sp.tr.name,c.x+8,songY+songH*.38);
        ctx.fillStyle="#8A96A8";ctx.font="11px system-ui";
        ctx.fillText(sp.tr.artists,c.x+8,songY+songH*.72);
      }
      ctx.restore()}
  });
  W.secs.forEach(sx=>{
    if(sx.end<P.t-half||sx.start>P.t+half)return;
    const c=clip(X(sx.start)+1,(sx.end-sx.start)*pps-2);if(c.w<=0)return;
    ctx.fillStyle=sx.s.color;ctx.globalAlpha=.3;
    ctx.fillRect(c.x,secY+(tiny?1:4),c.w,secH-(tiny?2:8));ctx.globalAlpha=1;
    ctx.fillRect(c.x,secY+(tiny?1:4),c.w,tiny?3:4);
    if(c.w>46){ctx.save();ctx.beginPath();ctx.rect(c.x+6,secY,c.w-12,secH);ctx.clip();
      ctx.fillStyle="#fff";ctx.font="700 12px 'Chakra Petch'";
      if(tiny){
        ctx.fillText(sx.s.name,c.x+8,secY+secH/2);
      }else{
        ctx.fillText(sx.s.name,c.x+8,secY+secH*.42);
        ctx.fillStyle=sx.s.color;ctx.font="700 10px 'Chakra Petch'";
        ctx.fillText(INTENSITY[sx.s.intensity].label+" · "+fmt(sx.s.lenSec),c.x+8,secY+secH*.75);
      }
      ctx.restore()}
  });
  /* ruler between lanes */
  ctx.fillStyle="rgba(11,14,19,.9)";ctx.fillRect(0,ruleY,CW,ruleH);
  ctx.font="10px 'IBM Plex Mono'";
  const step=tiny?60:30,t0=Math.max(0,Math.floor((P.t-half)/step)*step);
  for(let t=t0;t<=P.t+half;t+=step){
    const x=Math.round(X(t))+.5;
    ctx.strokeStyle="#3A4657";ctx.beginPath();ctx.moveTo(x,ruleY+ruleH-5);ctx.lineTo(x,ruleY+ruleH-1);ctx.stroke();
    ctx.fillStyle="#8A96A8";ctx.fillText(fmt(t),x+3,ruleY+ruleH/2);
  }
  /* transition ticks */
  W.spans.slice(0,-1).forEach(sp=>{
    if(sp.end<P.t-half||sp.end>P.t+half)return;
    const x=Math.round(X(sp.end))+.5;
    const h=at(W.secs,sp.end),bad=h&&h.s.intensity==="peak";
    ctx.strokeStyle=bad?"#FF3B5C":"rgba(240,180,55,.8)";ctx.lineWidth=bad?2:1;
    ctx.setLineDash(bad?[]:[3,3]);
    ctx.beginPath();ctx.moveTo(x,songY);ctx.lineTo(x,secY+secH);ctx.stroke();
    ctx.setLineDash([]);ctx.lineWidth=1;
  });
  /* centred playhead */
  const px=Math.round(CW/2)+.5;
  ctx.strokeStyle="#FFD166";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(px,2);ctx.lineTo(px,CH-2);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle="#FFD166";
  ctx.beginPath();ctx.moveTo(px-7,0);ctx.lineTo(px+7,0);ctx.lineTo(px,9);ctx.closePath();ctx.fill();
}

/* ---------- boot ---------- */
/* sync-core.js is this page's only shared-logic dependency (docs/adr/0003). It is
   checked HERE, at boot, rather than discovered at first use: absorbStep is called
   from tick(), so a missing or stale copy would otherwise surface as a frozen
   countdown rather than as an error. Cloudflare caches .js and ignores the server's
   no-cache, which is what the ?v= marker on the script tag is for; this gate catches
   the case where the edge served an old body anyway. analyze.html's NEEDS_CORE gate
   is the precedent. scripts/check.py keeps the three numbers in step. */
const NEEDS_SYNC=2;
(async()=>{
  $("#ruShow").textContent=AUTH.redirectUri;
  if(!window.PLSync){
    $("#who").innerHTML='<span style="color:var(--alert)">sync-core.js failed to load. '+
      'Hard-refresh (<b>Ctrl+Shift+R</b>) and restart server.py.</span>';
    return;
  }
  if(PLSync.SYNC_VERSION!==NEEDS_SYNC){
    $("#who").innerHTML='<span style="color:var(--alert)">Version mismatch: this page '+
      'needs sync-core.js v'+NEEDS_SYNC+' but loaded v'+PLSync.SYNC_VERSION+'. '+
      'Copy the current <b>sync-core.js</b>, restart server.py, then hard-refresh '+
      '(<b>Ctrl+Shift+R</b>).</span>';
    return;
  }
  try{
    if(location.search.includes("code=")&&AUTH.clientId){
      const code=new URLSearchParams(location.search).get("code");
      history.replaceState({},"",AUTH.redirectUri);
      await tokenRequest({grant_type:"authorization_code",code,redirect_uri:AUTH.redirectUri,
        client_id:AUTH.clientId,code_verifier:LSD.get("verifier","")});
    }
    if(!AUTH.tok){
      $("#who").textContent="Not connected on this device.";
      $("#connectBox").style.display="block";
      if(CFG_ID){ // app ships its client ID: one-tap login
        $("#clientRow").style.display="none";
        $("#connectBox").querySelector(".note").innerHTML='Log into your Spotify account on this device (one time).<br><br><button class="bigbtn primary" id="goLogin" style="width:100%">Log in with Spotify</button>';
        $("#goLogin").onclick=()=>login();
      }else{
        $("#cid").value=AUTH.clientId||"";
        $("#loginBtn").onclick=()=>{const v=$("#cid").value.trim();
          if(!/^[0-9a-f]{32}$/i.test(v)){toast("That doesn't look like a Client ID");return}
          AUTH.clientId=v;login()};
      }
      return;
    }
    me=await api("/me");
    $("#who").textContent="Connected as "+(me.display_name||me.id);
    const ns="u_"+String(me.id).replace(/[^A-Za-z0-9_-]/g,"_").slice(0,48);
    window.NS_URL="/api/state/"+ns;
    window.HIST_URL="/api/history/"+ns;
    LSD.set("ns",ns);          // let the calendar load history without a Spotify call
    let st={};
    try{const r=await fetch("/api/state/"+ns,{cache:"no-store"});if(r.ok)st=await r.json()||{}}catch(e){}
    workspaces=st.workspaces||{};
    if(!Object.keys(workspaces).length){ // account not migrated yet: fall back to legacy shared file
      try{const r=await fetch("/api/state",{cache:"no-store"});if(r.ok){const a=await r.json()||{};workspaces=a.workspaces||{}}}catch(e){}
    }
    initShuffleToggle();
    $("#targetBox").style.display="block";
    setTarget(target);         // keep the chosen target; setTarget explains if the login can't do it
    renderSplash();
  }catch(e){
    $("#who").textContent="Connection problem: "+e.message;
    $("#connectBox").style.display="block";$("#cid").value=AUTH.clientId||"";
    $("#loginBtn").onclick=()=>{AUTH.clientId=$("#cid").value.trim();login()};
  }
})();
</script>
