<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pulseline">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Pulseline · Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13;--panel:#151A23;--line:#242D3B;--ink:#E9EEF5;--muted:#8A96A8;--faint:#5A667A;
  --tape:#F0B437;--alert:#FF3B5C;--ok:#4FC98B;
  --ic:#37A8A0;                 /* current interval color, animated */
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Chakra Petch',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;
  height:100dvh;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ splash ============ */
#splash{height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px 18px;gap:14px;overflow-y:auto}
#splash h1{font-family:var(--disp);font-size:22px;letter-spacing:.05em}
#splash h1 em{font-style:normal;color:var(--tape)}
#splash .sub{color:var(--muted);font-size:13px;margin-top:-8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
button.card:active{border-color:var(--tape)}
.card .nm{font-family:var(--disp);font-weight:700;font-size:16px;margin-bottom:6px}
.card .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .meta b{color:var(--ink)}
.card .warn{color:var(--alert)}
.card .okc{color:var(--ok)}
.card .ibar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px}
.note{color:var(--faint);font-size:12.5px;line-height:1.5}
.btnrow{display:flex;gap:10px}
.bigbtn{flex:1;font-family:var(--disp);font-weight:700;font-size:15px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:center;text-decoration:none;color:var(--ink)}
.bigbtn.primary{background:var(--tape);color:#141414;border-color:var(--tape)}
.bigbtn.on{background:var(--tape);color:#141414;border-color:var(--tape)}
#clientRow{display:flex;gap:8px}
#clientRow input{flex:1;font-family:var(--mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);outline:none}

/* ============ workout mode ============ */
#work{display:none;height:100dvh;flex-direction:column;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 34%,
    color-mix(in srgb,var(--ic) 55%,#0B0E13) 78%,var(--ic) 120%);
  transition:--ic .6s;padding-bottom:env(safe-area-inset-bottom)}
#strip{height:31dvh;min-height:170px;position:relative;padding-top:max(8px,env(safe-area-inset-top))}
body.m-min #strip{height:15dvh;min-height:96px;max-height:120px}
body.m-focus #strip{display:none}
body.m-focus #hud{padding-top:max(14px,env(safe-area-inset-top))}
body.m-focus #intName{font-size:clamp(24px,7vw,40px)}
#tl{display:block;width:100%;height:100%}
#hud{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:6px 16px 4px;text-align:center;min-height:0}
#topInfo{display:flex;flex-direction:column;gap:2px;align-items:center;flex:0 0 auto}
/* flex:1 + min-height:0 means this box's size comes from the layout, not from the text inside.
   (If it ever sizes to its content, fitCount feeds back into itself and creeps.) */
#countWrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;
  width:100%;min-height:0;overflow:hidden}
#songLine{font-size:14.5px;color:var(--ink);max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songLine .art{color:var(--muted)}
#songTime{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:2px}
#intName{font-family:var(--disp);font-weight:700;font-size:clamp(21px,6.5vw,34px);letter-spacing:.04em;
  text-shadow:0 2px 14px rgba(0,0,0,.45);margin-top:2px;
  max-width:96vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Each glyph sits in a fixed-width cell, so the timer never shifts as digits change.
   (Rajdhani has no tabular-figure feature, so we enforce the grid ourselves.) */
#count{font-family:'Rajdhani',var(--disp);font-weight:700;
  font-size:34vw;line-height:.86;white-space:nowrap;letter-spacing:0;
  text-shadow:0 4px 30px rgba(0,0,0,.5)}
#count i{font-style:normal;display:inline-block;text-align:center}
#count i.d{width:.58em}
#count i.c{width:.26em}
#totals{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.66)}
#controls{display:flex;gap:12px;padding:8px 16px 14px;align-items:center}
#exitBtn,#pauseBtn,#modeBtn{border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.3);backdrop-filter:blur(4px)}
#exitBtn,#modeBtn{width:64px;height:58px;font-size:20px}
#pauseBtn{flex:1;height:58px;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.06em}
#pauseBtn.paused{background:var(--tape);color:#141414;border-color:var(--tape)}
#liveTag{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;font-family:var(--mono);font-size:10.5px;
  padding:2px 9px;border-radius:12px;background:rgba(0,0,0,.4)}
#liveTag.live{color:var(--ok)}#liveTag.sim{color:var(--muted)}
/* ---- landscape on a phone: solid interval color, name + timer only ---- */
@media (orientation:landscape) and (max-height:520px){
  /* always full-size focus: solid interval color, white type, no mode switching */
  #work{background:var(--ic);transition:background .5s}
  #strip,#songLine,#songTime,#totals,#liveTag,#modeBtn{display:none!important}
  /* the notch lands left or right depending on which way you turned — respect both */
  #hud{justify-content:center;color:#fff;
    padding:2vh calc(72px + env(safe-area-inset-right)) 2vh calc(16px + env(safe-area-inset-left))}
  #topInfo{flex:0 0 auto}
  #countWrap{flex:1 1 0;min-height:0}      /* same rule in landscape — never content-sized */
  #intName{font-family:var(--disp);font-weight:700;font-size:clamp(18px,5vh,42px);
    letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.28);opacity:.95;color:#fff;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #count{font-family:'Rajdhani',var(--disp);font-weight:700;
    line-height:.88;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.25)}
  #controls{position:fixed;right:calc(8px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);
    flex-direction:column;gap:8px;padding:0;width:auto}
  #exitBtn{width:44px;height:40px;font-size:15px;border-color:rgba(255,255,255,.5);
    background:rgba(0,0,0,.16);color:#fff}
  #pauseBtn{flex:0 0 auto;width:44px;height:74px;font-size:11px;letter-spacing:.06em;
    border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.16);color:#fff;writing-mode:vertical-rl}
  #pauseBtn.paused{background:rgba(255,255,255,.92);color:#141414;border-color:transparent}
  #toast{bottom:14px}
}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0B0E13;border:1px solid var(--line);
  border-radius:10px;padding:10px 16px;font-size:13px;display:none;z-index:99;max-width:92vw;text-align:center}
#confirmOv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;
  background:rgba(6,9,14,.82);backdrop-filter:blur(3px);padding:16px}
#confirmOv.on{display:flex}
#confirmBox{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;width:min(420px,92vw);text-align:center;
  max-height:92dvh;overflow:auto}
#confirmBox h3{font-family:var(--disp);font-size:19px;margin-bottom:6px}
#confirmBox p{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:16px}
.cbtn{display:block;width:100%;font-family:var(--disp);font-weight:700;font-size:15px;
  padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);margin-top:8px}
.cbtn.primary{background:var(--tape);border-color:var(--tape);color:#141414}
.cbtn.danger{background:transparent;border-color:var(--alert);color:var(--alert)}
@media (orientation:landscape) and (max-height:520px){
  #confirmBox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:min(560px,94vw);padding:14px}
  #confirmBox h3{flex:1 1 100%;font-size:16px;margin:0}
  #confirmBox p{flex:1 1 100%;margin:0 0 6px}
  .cbtn{flex:1;width:auto;margin:0;padding:12px}
}
#doneOv{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(6,9,14,.88);z-index:50;text-align:center}
#doneOv h2{font-family:var(--disp);font-size:30px;color:var(--tape)}
#doneOv p{font-family:var(--mono);color:var(--muted)}
</style>
</head>
<body>

<div id="splash">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
    <h1><a href="./" style="color:inherit;text-decoration:none" title="Back to the editor">PULSE<em>LINE</em></a> <span style="font-size:13px;color:var(--faint)">workout mode</span></h1>
    <a href="calendar.html" style="font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--tape);
      text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;white-space:nowrap">Calendar</a>
  </div>
  <div class="sub" id="who">Checking Spotify connection…</div>
  <div id="connectBox" style="display:none">
    <p class="note" style="margin-bottom:10px">Log into Spotify on this device (one time). Uses the same app Client ID as the desktop dashboard; make sure <b id="ruShow"></b> is added as a redirect URI.</p>
    <div id="clientRow"><input id="cid" placeholder="Spotify Client ID" spellcheck="false">
      <button class="bigbtn primary" id="loginBtn" style="flex:0 0 auto">Log in</button></div>
  </div>
  <div id="targetBox" style="display:none">
    <div style="font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:6px">PLAY THROUGH</div>
    <div style="display:flex;gap:8px">
      <button class="bigbtn" id="tgtSdk">This app</button>
      <button class="bigbtn" id="tgtConnect">Spotify app</button>
    </div>
    <p class="note" id="tgtNote" style="margin-top:6px"></p>
  </div>
  <div id="wsList"></div>
  <p class="note" id="hint"></p>
</div>

<div id="work">
  <div id="strip"><canvas id="tl"></canvas><span id="liveTag"></span></div>
  <div id="hud">
    <div id="topInfo">
      <div id="songLine"></div>
      <div id="songTime"></div>
      <div id="intName"></div>
    </div>
    <div id="countWrap"><div id="count">0:00</div></div>
    <div id="totals"></div>
  </div>
  <div id="controls">
    <button id="exitBtn" title="End workout">✕</button>
    <button id="pauseBtn">PAUSE</button>
    <button id="modeBtn" title="Display mode: full / minimal / focus">▤</button>
  </div>
</div>

<div id="confirmOv">
  <div id="confirmBox">
    <h3>End this workout?</h3>
    <p id="confirmStats"></p>
    <button class="cbtn primary" id="cfEnd">End workout</button>
    <button class="cbtn danger" id="cfDiscard">Discard workout</button>
    <button class="cbtn" id="cfBack">Keep going</button>
  </div>
</div>

<div id="doneOv"><h2>WORKOUT COMPLETE</h2><p id="doneStats"></p>
  <button class="bigbtn primary" id="doneBtn" style="flex:0;padding:14px 40px">Done</button></div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`:`${m}:${String(ss).padStart(2,"0")}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT;function toast(m,ms=3200){const t=$("#toast");t.textContent=m;t.style.display="block";
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",ms)}
const INTENSITY={low:{label:"LOW",color:"#37A8A0"},medium:{label:"MED",color:"#E7B94F"},
                 high:{label:"HIGH",color:"#EA7A3B"},peak:{label:"PEAK",color:"#E93E5C"}};

/* ---------- device auth (same localStorage keys as the dashboard) ---------- */
const LSD={get:(k,d)=>{try{const v=localStorage.getItem("pl_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
           set:(k,v)=>localStorage.setItem("pl_"+k,JSON.stringify(v))};
const CFG_ID=(typeof window.PULSELINE_CLIENT_ID==="string"&&/^[0-9a-f]{32}$/i.test(window.PULSELINE_CLIENT_ID))
  ?window.PULSELINE_CLIENT_ID:null;
const AUTH={get clientId(){return CFG_ID||LSD.get("clientId",null)},set clientId(v){LSD.set("clientId",v)},
  get tok(){return LSD.get("tok",null)},set tok(v){LSD.set("tok",v)},
  redirectUri:location.origin+location.pathname};
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function tokenRequest(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  if(!r.ok)throw new Error("Spotify login failed ("+r.status+")");
  const j=await r.json();
  AUTH.tok={access:j.access_token,refresh:j.refresh_token||(AUTH.tok&&AUTH.tok.refresh),
    scope:j.scope||(AUTH.tok&&AUTH.tok.scope)||"",exp:Date.now()+(j.expires_in-60)*1000};
}
async function login(){
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  LSD.set("verifier",verifier);
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({
    client_id:AUTH.clientId,response_type:"code",redirect_uri:AUTH.redirectUri,
    scope:"playlist-read-private playlist-read-collaborative user-read-playback-state user-modify-playback-state streaming user-read-email user-read-private",
    code_challenge_method:"S256",code_challenge:challenge});
}
async function ensureToken(){
  const t=AUTH.tok;if(!t)throw new Error("Not connected");
  if(Date.now()<t.exp)return t.access;
  await tokenRequest({grant_type:"refresh_token",refresh_token:t.refresh,client_id:AUTH.clientId});
  return AUTH.tok.access;
}
async function api(path,opts={}){
  const access=await ensureToken();
  const r=await fetch("https://api.spotify.com/v1"+path,{method:opts.method||"GET",
    headers:{Authorization:"Bearer "+access,...(opts.body?{"Content-Type":"application/json"}:{})},
    body:opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===429){await new Promise(res=>setTimeout(res,2000));return api(path,opts)}
  if(!r.ok)throw new Error("Spotify "+r.status);
  return r.status===204?null:r.json();
}

/* ---------- workout state ---------- */
let me=null,workspaces={},W=null;   // W = active run {ws,key,spans,secs,total,plTotal,live}
const P={t:0,playing:false,last:0,prevSec:-1,slew:0,started:false};
const spansOf=trs=>{let t=0;return trs.map(tr=>{const s={start:t,end:t+tr.durMs/1000,tr};t=s.end;return s})};
const secsOf=ss=>{let t=0;return ss.map(s=>{const x={start:t,end:t+s.lenSec,s};t=x.end;return x})};
const at=(arr,t)=>arr.find(x=>t>=x.start&&t<x.end);

/* ---------- splash ---------- */
function clashCount(spans,secs){let n=0;
  for(let i=0;i<spans.length-1;i++){const h=at(secs,spans[i].end);if(h&&h.s.intensity==="peak")n++}return n}
function renderSplash(){
  const list=$("#wsList");
  const keys=Object.keys(workspaces).filter(k=>{
    const w=workspaces[k];return w&&Array.isArray(w.tracks)&&w.tracks.length&&Array.isArray(w.sections)&&w.sections.length});
  if(!keys.length){
    list.innerHTML='<div class="card"><div class="nm">No workouts yet</div><div class="note">Build a playlist + interval program in the desktop dashboard first — every playlist with an interval list shows up here automatically.</div></div>';
    return;
  }
  keys.sort((a,b)=>(workspaces[b].updated||0)-(workspaces[a].updated||0));
  const PAL=["#F0B437","#37A8A0","#E8743B","#E93E5C","#7C6FE0","#4FC98B","#E7B94F","#4EA8DE"];
  const defC=k=>PAL[[...String(k)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
  list.innerHTML=keys.map(k=>{
    const w=workspaces[k],spans=spansOf(w.tracks),secs=secsOf(w.sections);
    const col=w.color||defC(k);
    const wk=secs.length?secs[secs.length-1].end:0, pl=spans.length?spans[spans.length-1].end:0;
    const cl=clashCount(spans,secs);
    const bar=secs.map(x=>`<span style="flex:${x.s.lenSec};background:${x.s.color}"></span>`).join("");
    return `<button class="card" data-k="${esc(k)}" style="width:100%;margin-bottom:10px;border-left:5px solid ${col}">
      <div class="nm">${esc(w.name||k)}${k==="demo"?" (demo)":""}</div>
      <div class="meta"><span>workout <b>${fmt(wk)}</b></span><span>music <b>${fmt(pl)}</b></span>
        <span>${w.sections.length} intervals</span>
        <span class="${cl?"warn":"okc"}">${cl?cl+" peak clash"+(cl>1?"es":""):"✓ clean"}</span>
        ${w.dirty?'<span class="warn">unsaved edits → simulated only</span>':""}</div>
      <div class="ibar">${bar}</div>
    </button>`}).join("");
  $("#hint").textContent="Tip: start your watch workout + open Spotify first, then pick a workout here.";
}
$("#wsList").addEventListener("click",e=>{
  const c=e.target.closest(".card[data-k]");if(c)startWorkout(c.dataset.k);
});

/* ---------- Spotify Web Playback SDK (browser as the player) ---------- */
let sdk=null,sdkId=null,sdkReady=null;
const hasStreamScope=()=>((LSD.get("tok",{})||{}).scope||"").includes("streaming");
let target=LSD.get("target","sdk");     // "sdk" = play in this app, "connect" = external device
function setTarget(t){
  target=t;LSD.set("target",t);
  $("#tgtSdk").className="bigbtn"+(t==="sdk"?" on":"");
  $("#tgtConnect").className="bigbtn"+(t==="connect"?" on":"");
  $("#tgtNote").textContent=t==="sdk"
    ?"Audio plays from this app — keep the screen on (it stays awake automatically). Nothing else to open."
    :"Audio plays on whatever device Spotify is active on. Open the Spotify app first.";
  if(t==="sdk")initSdk();
}
$("#tgtSdk").onclick=()=>{
  if(!hasStreamScope()){
    if(confirm("Playing in-app needs one extra Spotify permission. Log in again to grant it?"))login();
    return;
  }
  setTarget("sdk");
};
$("#tgtConnect").onclick=()=>setTarget("connect");
function initSdk(){
  if(sdkReady||!window.Spotify||!hasStreamScope())return sdkReady;
  sdkReady=new Promise(resolve=>{
    sdk=new Spotify.Player({name:"Pulseline",getOAuthToken:cb=>ensureToken().then(cb),volume:1});
    sdk.addListener("ready",({device_id})=>{sdkId=device_id;resolve(device_id)});
    sdk.addListener("not_ready",()=>{sdkId=null});
    sdk.addListener("initialization_error",({message})=>{toast("Player init failed: "+message,5000);resolve(null)});
    sdk.addListener("authentication_error",({message})=>{toast("Player auth failed — try logging in again",5000);resolve(null)});
    sdk.addListener("account_error",()=>{toast("In-app playback needs Spotify Premium",5000);resolve(null)});
    /* real-time sync: fires on every play/pause/seek/track change — no polling */
    sdk.addListener("player_state_changed",st=>{
      if(!st||!W||target!=="sdk")return;
      if(!P.started)return;                       // still armed at 0:00, waiting for START
      if(st.paused&&P.playing&&!st.loading){setPaused(true);return}
      if(!st.paused&&!P.playing){setPaused(false);return}   // resumed from headphones/lock screen
      const uri=st.track_window&&st.track_window.current_track&&st.track_window.current_track.uri;
      if(!uri)return;
      let best=-1,bd=1e12;
      W.spans.forEach((sp,i)=>{if(W.ws.tracks[i].uri===uri){const d=Math.abs(sp.start-P.t);if(d<bd){bd=d;best=i}}});
      if(best<0)return;
      const serverT=W.spans[best].start+(st.position||0)/1000;
      const d=serverT-P.t;
      if(Math.abs(d)>2.5){P.t=serverT;P.slew=0;P.last=performance.now()}
      else P.slew=d;
    });
    sdk.connect();
  });
  return sdkReady;
}
window.onSpotifyWebPlaybackSDKReady=()=>{if(target==="sdk"&&hasStreamScope())initSdk()};

/* ---------- audio cues ---------- */
let AC=null,master=null;
function ensureAudio(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  if(!master){ // compressor lets us run hot without clipping — the dings must beat the music
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=8;
    comp.attack.value=.002;comp.release.value=.15;
    master=AC.createGain();master.gain.value=1;
    master.connect(comp);comp.connect(AC.destination);
  }
}
function beep(f,t0,dur=.22,vol=1){
  /* square wave (far more piercing than sine) + an octave partial for presence */
  [[1,vol],[2,vol*.45]].forEach(([mult,g])=>{
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type="square";o.frequency.value=f*mult;
    gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(g,t0+.012);
    gn.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(gn).connect(master);o.start(t0);o.stop(t0+dur+.06);
  });
}
function cueSection(intensity){const n=AC.currentTime;
  if(intensity==="peak"){beep(740,n);beep(880,n+.2);beep(1175,n+.4,.4)}   // rising: go time
  else{beep(880,n);beep(660,n+.24,.3)}}
function cueDone(){const n=AC.currentTime;beep(880,n,.25);beep(660,n+.28,.25);beep(440,n+.58,.6)}

/* ---------- display modes: full → minimal → focus ---------- */
const MODES=["full","min","focus"],MODE_ICON={full:"▤",min:"▬",focus:"◻"};
let dispMode=LSD.get("dispMode","full");
if(!MODES.includes(dispMode))dispMode="full";
function applyMode(){
  document.body.classList.remove("m-full","m-min","m-focus");
  document.body.classList.add("m-"+dispMode);
  $("#modeBtn").textContent=MODE_ICON[dispMode];
  LSD.set("dispMode",dispMode);
  requestAnimationFrame(()=>{
    if(W&&dispMode!=="focus"){sizeCanvas();draw()}
    fitCount(true);                       // the timer's box just changed size
  });
}
$("#modeBtn").onclick=()=>{
  dispMode=MODES[(MODES.indexOf(dispMode)+1)%MODES.length];
  applyMode();
};

/* ---------- wake lock ---------- */
let wake=null;
async function grabWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(W&&document.visibilityState==="visible")grabWake()});

/* ---------- run lifecycle ---------- */
async function startWorkout(key){
  const ws=workspaces[key];
  const spans=spansOf(ws.tracks),secs=secsOf(ws.sections);
  W={ws,key,spans,secs,total:secs[secs.length-1].end,
     plTotal:spans.length?spans[spans.length-1].end:0,
     live:key!=="demo"&&!ws.dirty};
  P.t=0;P.prevSec=-1;P.started=false;
  ensureAudio();
  /* iOS requires the audio element to be unlocked inside the tap that started us */
  if(W.live&&target==="sdk"&&sdk){try{await sdk.activateElement()}catch(e){}}
  $("#splash").style.display="none";$("#work").style.display="flex";
  $("#liveTag").textContent=W.live?(target==="sdk"?"● IN-APP":"● LIVE"):"SIMULATED";
  $("#liveTag").className=W.live?"live":"sim";
  grabWake();
  /* Nothing plays yet. Silence until START — the music and the clock begin together.
     We only warm up the SDK device here so START has no wait. */
  if(W.live&&target==="sdk")initSdk();
  P.playing=false;P.started=false;
  $("#pauseBtn").textContent="START";
  $("#pauseBtn").classList.add("paused");
  applyMode();
  sizeCanvas();draw();updateHud();fitCount(true);
}
async function logWorkout(completed){
  if(!window.NS_URL||!W){toast("Workout not logged — no profile connection");return}
  /* snapshot EVERYTHING synchronously: W is nulled the moment we return to the splash,
     so nothing after an await may touch it */
  const entry={id:Math.random().toString(36).slice(2,10),ts:Date.now(),
    key:W.key,name:W.ws.name||W.key,color:W.ws.color||null,
    planned:Math.round(W.total),elapsed:Math.round(Math.min(P.t,W.total)),completed:!!completed};
  const url=window.NS_URL;
  try{
    const r=await fetch(url,{cache:"no-store"});
    const st=r.ok?(await r.json()||{}):{};
    st.history=st.history||[];
    st.history.push(entry);
    const w=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(st)});
    if(!w.ok)throw new Error("save rejected ("+w.status+")");
    toast("Workout logged ✓ "+fmt(entry.elapsed));
  }catch(e){toast("Couldn't log workout: "+e.message,5000)}
}
function endWorkout(showDone,doLog){
  /* showDone === finished naturally: leave the playlist rolling (cooldown music).
     Only an explicit ✕ exit stops the audio. */
  if(W&&W.live&&!showDone){
    if(target==="sdk"&&sdk)sdk.pause().catch(()=>{});
    else api("/me/player/pause",{method:"PUT"}).catch(()=>{});
  }
  P.playing=false;clearInterval(pollH);pollH=null;stopPausePoll();
  if(doLog===undefined?showDone:doLog)logWorkout(showDone);
  if(wake){wake.release().catch(()=>{});wake=null}
  if(showDone){cueDone();
    $("#doneStats").textContent=`${fmt(W.total)} · ${W.ws.sections.length} intervals · ${W.ws.name||""}`
      +(W.live?" · music still playing":"");
    $("#doneOv").style.display="flex";
  }else backToSplash();
}
function backToSplash(){
  $("#confirmOv").classList.remove("on");
  $("#doneOv").style.display="none";
  $("#work").style.display="none";$("#splash").style.display="flex";
  W=null;
}
$("#doneBtn").onclick=backToSplash;
$("#exitBtn").onclick=()=>{
  if(!W)return;
  const sx=at(W.secs,P.t);
  $("#confirmStats").textContent=
    `${fmt(P.t)} done of ${fmt(W.total)}`+(sx?` · ${sx.s.name}`:"")+
    " — End saves it to your history, Discard doesn't";
  $("#confirmOv").classList.add("on");
};
$("#cfBack").onclick=()=>$("#confirmOv").classList.remove("on");
$("#confirmOv").onclick=e=>{if(e.target===$("#confirmOv"))$("#confirmOv").classList.remove("on")};
$("#cfEnd").onclick=()=>{$("#confirmOv").classList.remove("on");endWorkout(false,true)};
$("#cfDiscard").onclick=()=>{$("#confirmOv").classList.remove("on");endWorkout(false,false)};
$("#pauseBtn").onclick=()=>setPaused(P.playing);
async function beginPlayback(){          // called from the START tap (a user gesture)
  if(!W.live)return true;
  try{
    let q="";
    if(target==="sdk"){
      if(sdk){try{await sdk.activateElement()}catch(e){}}   // iOS unlock, inside the gesture
      const id=await Promise.race([initSdk()||Promise.resolve(null),
        new Promise(r=>setTimeout(()=>r(sdkId),6000))]);
      if(!id)throw new Error("in-app player unavailable");
      q="?device_id="+encodeURIComponent(id);
    }
    await api("/me/player/play"+q,{method:"PUT",
      body:{context_uri:"spotify:playlist:"+W.key,offset:{position:0},position_ms:0}});
    return true;
  }catch(e){
    W.live=false;$("#liveTag").textContent="SIMULATED";$("#liveTag").className="sim";
    toast(target==="sdk"
      ?"In-app playback failed ("+e.message+") — switch to 'Spotify app' on the splash. Running simulated."
      :"Couldn't start Spotify — open the app, tap play once, then restart here. Running simulated.",5000);
    return true;   // the workout still runs, just silently
  }
}
function setPaused(pause){
  if(!W)return;
  const first=!pause&&!P.started;
  if(!pause)P.started=true;
  P.playing=!pause;
  $("#pauseBtn").textContent=pause?(P.started?"RESUME":"START"):"PAUSE";
  $("#pauseBtn").classList.toggle("paused",pause);
  if(W.live){
    if(first)beginPlayback();                                  // music + clock start together
    else if(target==="sdk"&&sdk)sdk[pause?"pause":"resume"]().catch(()=>{});
    else api("/me/player/"+(pause?"pause":"play"),{method:"PUT"}).catch(()=>{});
  }
  if(P.playing){P.last=performance.now();requestAnimationFrame(tick);startPoll();stopPausePoll()}
  else{clearInterval(pollH);pollH=null;startPausePoll()}
}

/* ---------- clock ---------- */
function tick(ts){
  if(!W||!P.playing)return;
  const dt=Math.min(.25,(ts-P.last)/1000);P.last=ts;
  P.t+=dt;
  /* absorb sync corrections gently (max ±12% clock rate) so the countdown never flickers */
  if(P.slew){const step=Math.sign(P.slew)*Math.min(Math.abs(P.slew),dt*.12);P.t+=step;P.slew-=step}
  const secIdx=W.secs.findIndex(x=>P.t>=x.start&&P.t<x.end);
  if(secIdx!==P.prevSec){
    if(secIdx>=0&&P.prevSec>=0)cueSection(W.secs[secIdx].s.intensity);   // interval boundary ding
    P.prevSec=secIdx;
  }
  if(P.t>=W.total){P.t=W.total;draw();updateHud();endWorkout(true);return}
  drawSafe();updateHud();
  requestAnimationFrame(tick);
}
let pausePollH=null,pausePollStart=0;
function startPausePoll(){          // watch for an external resume (headphone tap, lock screen)
  clearTimeout(pausePollH);
  if(!W||!W.live||!P.started||target==="sdk")return;   // SDK gets this via events, for free
  pausePollStart=pausePollStart||Date.now();
  const age=Date.now()-pausePollStart;
  if(age>10*60*1000)return;                            // walked away — stop burning API calls
  const gap=age<2*60*1000?5000:20000;                  // attentive for 2 min, then relaxed
  pausePollH=setTimeout(async()=>{
    try{
      const st=await api("/me/player");
      if(st&&st.is_playing&&!P.playing&&W){setPaused(false);return}
    }catch(e){}
    startPausePoll();
  },gap);
}
function stopPausePoll(){clearTimeout(pausePollH);pausePollH=null;pausePollStart=0}
let pollH=null;
function startPoll(){
  clearInterval(pollH);
  if(!W||!W.live||target==="sdk")return;   // SDK sync is event-driven; no polling needed
  pollH=setInterval(async()=>{
    try{
      const t0=performance.now();
      const st=await api("/me/player");
      const rtt=(performance.now()-t0)/1000;
      if(!st||!st.item)return;
      if(!st.is_playing){if(P.playing)setPaused(true);return}
      const uri=st.item.uri;let best=-1,bd=1e12;
      W.spans.forEach((sp,i)=>{if(W.ws.tracks[i].uri===uri){const d=Math.abs(sp.start-P.t);if(d<bd){bd=d;best=i}}});
      if(best<0)return;
      /* latency-compensated server time: progress was snapshotted ~half an RTT ago */
      const serverT=W.spans[best].start+(st.progress_ms||0)/1000+rtt/2;
      const d=serverT-P.t;
      if(Math.abs(d)>2.5){P.t=serverT;P.slew=0;P.last=performance.now()}  // real jump: seek/skip
      else P.slew=d;                                                       // tiny drift: slew it away
    }catch(e){}
  },5000);
}

/* ---------- timer: fixed-width cells + fit-to-box sizing ---------- */
const CELL_D=.58,CELL_C=.26;              // em widths of a digit / colon cell (must match CSS)
let lastTxt="",lastFit="";
function setCount(txt){
  if(txt===lastTxt)return;
  lastTxt=txt;
  $("#count").innerHTML=[...txt].map(ch=>ch===":"
    ?'<i class="c">:</i>'
    :`<i class="d">${ch}</i>`).join("");
  fitCount();
}
const countRatio=txt=>[...txt].reduce((a,c)=>a+(c===":"?CELL_C:CELL_D),0);
function fitCount(force){
  const el=$("#count"),box=$("#countWrap"),txt=lastTxt||"0:00";
  const availW=(box.clientWidth||window.innerWidth)*.94;
  const availH=(box.clientHeight||window.innerHeight*.4)*.96;
  /* Quantise the box dims: tiny sub-pixel wobble must not re-trigger a fit, and the
     signature keys on cell COUNT (not the digits) so ticking never resizes. */
  const sig=txt.length+"|"+(availW/8|0)+"|"+(availH/8|0);
  if(!force&&sig===lastFit)return;
  lastFit=sig;
  const byW=availW/countRatio(txt);
  const byH=availH/.78;                    // cap height ≈ .78em
  el.style.fontSize=Math.round(Math.max(48,Math.min(byW,byH)))+"px";
}
window.addEventListener("load",()=>fitCount(true));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitCount(true));

/* ---------- HUD ---------- */
function updateHud(){
  const sp=at(W.spans,P.t),sx=at(W.secs,P.t);
  if(sp){$("#songLine").innerHTML=`♪ <b>${esc(sp.tr.name)}</b> <span class="art">— ${esc(sp.tr.artists)}</span>`;
    $("#songTime").textContent=`${fmt(P.t-sp.start)} / ${fmt(sp.tr.durMs/1000)}`}
  else{$("#songLine").innerHTML='<span class="art">— music ended —</span>';$("#songTime").textContent=""}
  if(sx){
    document.documentElement.style.setProperty("--ic",sx.s.color);
    $("#intName").textContent=sx.s.name;
    setCount(fmt(sx.end-P.t));
  }
  $("#totals").textContent=`T+ ${fmt(P.t)}  ·  ${fmt(W.total-P.t)} to go`;
}

/* ---------- sliding timeline strip (2-min window, playhead centred) ---------- */
const cvs=$("#tl"),ctx=cvs.getContext("2d");
let CW=360,CH=200;
function sizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  CW=cvs.clientWidth;CH=cvs.clientHeight;
  cvs.width=Math.round(CW*dpr);cvs.height=Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawSafe(){        // resync if the element box drifted from the backing store
  if(cvs.clientHeight!==CH||cvs.clientWidth!==CW)sizeCanvas();
  draw();
}
function onViewportChange(){
  if(!W)return;
  if(!document.body.classList.contains("m-focus")&&$("#strip").offsetParent!==null){sizeCanvas();draw()}
  updateHud();fitCount(true);
}
/* Wait for the viewport to stop moving, then lay out exactly once.
   iOS reports several intermediate sizes mid-rotation; fitting on each one is what
   made the transition look jittery. */
/* One settle pass per viewport change: watch until the window stops moving, then lay out once.
   All sources (resize / orientationchange / visualViewport / media query) funnel through
   the same debounced entry point, so a rotation can only ever trigger a single pass. */
let settleRaf=null,settleTimer=null;
function settleLayout(){
  cancelAnimationFrame(settleRaf);
  let lastW=-1,lastH=-1,stable=0,frames=0;
  const step=()=>{
    const w=innerWidth,h=innerHeight;        // window dims: independent of our own layout
    if(w===lastW&&h===lastH)stable++;else stable=0;
    lastW=w;lastH=h;frames++;
    if(stable>=2||frames>90){onViewportChange();return}
    settleRaf=requestAnimationFrame(step);
  };
  settleRaf=requestAnimationFrame(step);
}
function scheduleSettle(){clearTimeout(settleTimer);settleTimer=setTimeout(settleLayout,50)}
window.addEventListener("resize",scheduleSettle);
window.addEventListener("orientationchange",scheduleSettle);
if(window.visualViewport)window.visualViewport.addEventListener("resize",scheduleSettle);
if(window.matchMedia)matchMedia("(orientation:landscape)").addEventListener?.("change",scheduleSettle);
function draw(){
  const WIN=120,half=WIN/2;
  const pps=CW/WIN,X=t=>(t-(P.t-half))*pps;
  ctx.clearRect(0,0,CW,CH);
  /* Minimal mode compresses the BARS, never the type: fonts stay at full readable size
     and labels are vertically centred in whatever lane height is available. */
  const tiny=CH<130;
  const pad=tiny?4:8,gap=tiny?4:6,ruleH=tiny?14:16;
  const lanes=CH-pad*2-ruleH-gap*2;
  const songH=lanes*.5,secH=lanes*.5;
  const songY=pad,ruleY=songY+songH+gap,secY=ruleY+ruleH+gap;
  ctx.textBaseline="middle";
  /* lanes */
  ctx.fillStyle="rgba(21,26,35,.85)";
  ctx.fillRect(0,songY,CW,songH);ctx.fillRect(0,secY,CW,secH);
  const clip=(x,w)=>({x:Math.max(0,x),w:Math.min(CW,x+w)-Math.max(0,x)});
  W.spans.forEach((sp,i)=>{
    if(sp.end<P.t-half||sp.start>P.t+half)return;
    const c=clip(X(sp.start)+1,(sp.end-sp.start)*pps-2);if(c.w<=0)return;
    ctx.fillStyle=i%2?"#2A3444":"#39465C";
    ctx.fillRect(c.x,songY+(tiny?1:4),c.w,songH-(tiny?2:8));
    if(c.w>50){ctx.save();ctx.beginPath();ctx.rect(c.x+6,songY,c.w-12,songH);ctx.clip();
      ctx.fillStyle="#E9EEF5";ctx.font="600 12px system-ui";
      if(tiny){ // one line, vertically centred in the shorter lane
        ctx.fillText(sp.tr.name,c.x+8,songY+songH/2);
      }else{
        ctx.fillText(sp.tr.name,c.x+8,songY+songH*.38);
        ctx.fillStyle="#8A96A8";ctx.font="11px system-ui";
        ctx.fillText(sp.tr.artists,c.x+8,songY+songH*.72);
      }
      ctx.restore()}
  });
  W.secs.forEach(sx=>{
    if(sx.end<P.t-half||sx.start>P.t+half)return;
    const c=clip(X(sx.start)+1,(sx.end-sx.start)*pps-2);if(c.w<=0)return;
    ctx.fillStyle=sx.s.color;ctx.globalAlpha=.3;
    ctx.fillRect(c.x,secY+(tiny?1:4),c.w,secH-(tiny?2:8));ctx.globalAlpha=1;
    ctx.fillRect(c.x,secY+(tiny?1:4),c.w,tiny?3:4);
    if(c.w>46){ctx.save();ctx.beginPath();ctx.rect(c.x+6,secY,c.w-12,secH);ctx.clip();
      ctx.fillStyle="#fff";ctx.font="700 12px 'Chakra Petch'";
      if(tiny){
        ctx.fillText(sx.s.name,c.x+8,secY+secH/2);
      }else{
        ctx.fillText(sx.s.name,c.x+8,secY+secH*.42);
        ctx.fillStyle=sx.s.color;ctx.font="700 10px 'Chakra Petch'";
        ctx.fillText(INTENSITY[sx.s.intensity].label+" · "+fmt(sx.s.lenSec),c.x+8,secY+secH*.75);
      }
      ctx.restore()}
  });
  /* ruler between lanes */
  ctx.fillStyle="rgba(11,14,19,.9)";ctx.fillRect(0,ruleY,CW,ruleH);
  ctx.font="10px 'IBM Plex Mono'";
  const step=tiny?60:30,t0=Math.max(0,Math.floor((P.t-half)/step)*step);
  for(let t=t0;t<=P.t+half;t+=step){
    const x=Math.round(X(t))+.5;
    ctx.strokeStyle="#3A4657";ctx.beginPath();ctx.moveTo(x,ruleY+ruleH-5);ctx.lineTo(x,ruleY+ruleH-1);ctx.stroke();
    ctx.fillStyle="#8A96A8";ctx.fillText(fmt(t),x+3,ruleY+ruleH/2);
  }
  /* transition ticks */
  W.spans.slice(0,-1).forEach(sp=>{
    if(sp.end<P.t-half||sp.end>P.t+half)return;
    const x=Math.round(X(sp.end))+.5;
    const h=at(W.secs,sp.end),bad=h&&h.s.intensity==="peak";
    ctx.strokeStyle=bad?"#FF3B5C":"rgba(240,180,55,.8)";ctx.lineWidth=bad?2:1;
    ctx.setLineDash(bad?[]:[3,3]);
    ctx.beginPath();ctx.moveTo(x,songY);ctx.lineTo(x,secY+secH);ctx.stroke();
    ctx.setLineDash([]);ctx.lineWidth=1;
  });
  /* centred playhead */
  const px=Math.round(CW/2)+.5;
  ctx.strokeStyle="#FFD166";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(px,2);ctx.lineTo(px,CH-2);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle="#FFD166";
  ctx.beginPath();ctx.moveTo(px-7,0);ctx.lineTo(px+7,0);ctx.lineTo(px,9);ctx.closePath();ctx.fill();
}

/* ---------- boot ---------- */
(async()=>{
  $("#ruShow").textContent=AUTH.redirectUri;
  try{
    if(location.search.includes("code=")&&AUTH.clientId){
      const code=new URLSearchParams(location.search).get("code");
      history.replaceState({},"",AUTH.redirectUri);
      await tokenRequest({grant_type:"authorization_code",code,redirect_uri:AUTH.redirectUri,
        client_id:AUTH.clientId,code_verifier:LSD.get("verifier","")});
    }
    if(!AUTH.tok){
      $("#who").textContent="Not connected on this device.";
      $("#connectBox").style.display="block";
      if(CFG_ID){ // app ships its client ID: one-tap login
        $("#clientRow").style.display="none";
        $("#connectBox").querySelector(".note").innerHTML='Log into your Spotify account on this device (one time).<br><br><button class="bigbtn primary" id="goLogin" style="width:100%">Log in with Spotify</button>';
        $("#goLogin").onclick=()=>login();
      }else{
        $("#cid").value=AUTH.clientId||"";
        $("#loginBtn").onclick=()=>{const v=$("#cid").value.trim();
          if(!/^[0-9a-f]{32}$/i.test(v)){toast("That doesn't look like a Client ID");return}
          AUTH.clientId=v;login()};
      }
      return;
    }
    me=await api("/me");
    $("#who").textContent="Connected as "+(me.display_name||me.id);
    const ns="u_"+String(me.id).replace(/[^A-Za-z0-9_-]/g,"_").slice(0,48);
    window.NS_URL="/api/state/"+ns;
    let st={};
    try{const r=await fetch("/api/state/"+ns,{cache:"no-store"});if(r.ok)st=await r.json()||{}}catch(e){}
    workspaces=st.workspaces||{};
    if(!Object.keys(workspaces).length){ // account not migrated yet: fall back to legacy shared file
      try{const r=await fetch("/api/state",{cache:"no-store"});if(r.ok){const a=await r.json()||{};workspaces=a.workspaces||{}}}catch(e){}
    }
    $("#targetBox").style.display="block";
    setTarget(hasStreamScope()?target:"connect");
    renderSplash();
  }catch(e){
    $("#who").textContent="Connection problem: "+e.message;
    $("#connectBox").style.display="block";$("#cid").value=AUTH.clientId||"";
    $("#loginBtn").onclick=()=>{AUTH.clientId=$("#cid").value.trim();login()};
  }
})();
</script>
